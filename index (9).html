<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazilian Times - Portal de Notícias</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Nova Barra Superior de Destaque -->
  <div class="top-announcement">
    <div class="container top-announcement-content">
      <div class="status-tag">
        <span class="pulse-dot"></span> AO VIVO | Portal de Notícias
      </div>
      <div class="slogan-text">Jornalismo Independente & Sustentável</div>
    </div>
  </div>

  <!-- Cabeçalho Principal com Layout Renovado -->
  <header class="main-header">
    <div class="container header-container">
      <a href="#inicio" class="logo">
        <div class="logo-badge"><i class="fas fa-leaf"></i></div>
        <div class="logo-text">
          <span>BRAZILIAN</span> TIMES
        </div>
      </a>

      <button class="menu-toggle" onclick="abrirMenu()">
        <i class="fas fa-bars"></i>
      </button>

      <nav class="navbar" id="navbar">
        <a href="#inicio"><i class="fas fa-home"></i> Início</a>
        <a href="#noticias"><i class="fas fa-newspaper"></i> Notícias</a>
        <a href="#categoria-Brasil">Brasil</a>
        <a href="#categoria-Economia">Economia</a>
        <a href="#categoria-Tecnologia">Tecnologia</a>
        <a href="#login"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="#cadastro"><i class="fas fa-user-plus"></i> Cadastro</a>
        <a href="#admin" class="admin-link"><i class="fas fa-user-shield"></i> Painel CMS</a>
      </nav>
    </div>
  </header>

  <!-- Container Principal do Aplicativo -->
  <main id="app"></main>

  <!-- Rodapé com Horário Atualizado -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 Brazilian Times. Todos os direitos reservados.</p>
      <div class="footer-clock" id="dataEHorarioFooter">
        <i class="far fa-clock"></i> <span id="clock-text">A carregar horário...</span>
      </div>
      <p style="font-size: 0.85rem; color: #a7f3d0; margin-top: 8px;">Portal de Notícias & Sistema de Gestão CMS.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
